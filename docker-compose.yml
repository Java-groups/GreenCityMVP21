services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: greencity
      POSTGRES_USER: greencity
      POSTGRES_PASSWORD: greencity
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencity -d greencity"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - greencity-pgdata:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --location /data --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PROFILE: docker
      DATASOURCE_URL: jdbc:postgresql://db:5432/greencity
      DATASOURCE_USER: greencity
      DATASOURCE_PASSWORD: greencity

volumes:
  greencity-pgdata:
  azurite-data:
